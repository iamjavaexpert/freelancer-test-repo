<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<body>
<main layout:fragment="content">
<div class="container mx-auto mt-8 px-4">
    <h2 class="text-xl font-semibold mb-4 text-gray-800">Employee List</h2>

    <table class="employee-table">
        <thead>
        <tr>
            <th><i class="wa-user"></i> Name</th>
            <th><i class="wa-envelope"></i> Email</th>
            <th><i class="wa-badge"></i> Role</th>
            <th><i class="wa-diagram-project"></i> Projects</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.name}">John Doe</td>
            <td th:text="${employee.email}">john@example.com</td>
            <td th:text="${employee.role}">Developer</td>
            <td>
                <span th:each="project : ${employee.projects}"
                      th:text="${project.name}"
                      style="display: inline-block; margin-right: 0.5rem;">Project A</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</main>
</body>
</html>
