<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
<div class="container mx-auto mt-10 px-4">
    <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
        <i class="wa-calendar-lines-pen text-blue-600 text-2xl"></i> Monthly Time Report
    </h2>


    <form th:action="@{/timeentries/monthly/report}" method="get" class="bg-white p-6 rounded shadow-md mb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">

            <div>
                <label for="employeeId" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="wa-user-tie mr-1 text-blue-600"></i> Select Employee
                </label>
                <select name="employeeId" id="employeeId"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                        required>
                    <option value="">-- Select Employee --</option>
                    <option th:each="emp : ${employees}"
                            th:value="${emp.id}"
                            th:text="${emp.name}"
                            th:selected="${emp.id == selectedEmployeeId}"></option>
                </select>
            </div>
            <div>
                <label for="selectedMonth" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="wa-calendar mr-1 text-blue-600"></i> Select Month
                </label>
                <input type="month" name="selectedMonth" id="selectedMonth"
                       th:value="${#temporals.format(selectedMonth, 'yyyy-MM')}"
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                       required/>
            </div>
            </br>
            <div class="pt-6 md:pt-0 space-x-4 flex">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow flex items-center gap-2">
                    <i class="wa wa-eye"></i>
                    View Report
                </button>
            </div>

        </div>
    </form>

    <div th:if="${timeEntries != null}" class="bg-white p-6 rounded shadow-md">
        <h3 class="text-xl font-semibold mb-4 text-gray-800"
            th:text="'Report for ' + ${employee.name} + ' - ' + ${#temporals.format(selectedMonth, 'MMMM yyyy')}"></h3>

        <table class="min-w-full border-collapse">
            <thead class="bg-gray-100 text-left text-sm font-medium text-gray-600 border-b">
            <tr>
                <th class="py-2 px-4"><i class="wa-calendar mr-1"></i>Date</th>
                <th class="py-2 px-4"><i class="wa-diagram-project mr-1"></i>Project</th>
                <th class="py-2 px-4"><i class="wa-list-check mr-1"></i>Activity</th>
                <th class="py-2 px-4"><i class="wa-list-check mr-1"></i>Comment</th>
                <th class="py-2 px-4"><i class="wa-hourglass-half mr-1"></i>Hours</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${timeEntries}" class="border-b hover:bg-gray-50">
                <td class="py-2 px-4" th:text="${entry.entryDate}">2025-07-01</td>
                <td class="py-2 px-4" th:text="${entry.project.name}">Project A</td>
                <td class="py-2 px-4" th:text="${entry.activity}">Development</td>
                <td class="py-2 px-4" th:text="${entry.comment}">Working with UI</td>
                <td class="py-2 px-4" th:text="${entry.hoursWorked}">8.0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</main>
</body>
</html>
